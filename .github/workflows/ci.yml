name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: extractions/setup-just@v2
      # Upstream tracks the Go tree with CRLF, which makes gofmt report every
      # file on Linux. Keep this basic gate focused on substantive checks.
      - run: |
          just lint
          just test
